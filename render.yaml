# render.yaml

services:
  - type: web
    name: webdev-hq-api
    runtime: node
    plan: free
    region: frankfurt

    # Runs once during the build phase: install deps and generate the Prisma client.
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma

    # Runs after build but BEFORE new instances go live.
    # If this fails the deploy is aborted - the old version keeps serving traffic.
    # DATABASE_URL must be set as an environment variable in the Render dashboard.
    preDeployCommand: npx prisma migrate deploy --schema=prisma/schema.prisma

    # Only starts the server - migrations have already been applied above.
    startCommand: node index.js

    envVars:
      - key: NODE_ENV
        value: production
      # Set DATABASE_URL in the Render dashboard as a secret environment variable.
      # Format: mysql://user:password@host:port/database

    healthCheckPath: /common/v1/healthcheck
