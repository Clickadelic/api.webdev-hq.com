# render.yaml

services:
  - type: web
    name: webdev-hq-api
    runtime: node
    plan: free
    region: frankfurt

    # Install deps and generate the Prisma client.
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma

    # prisma migrate deploy is idempotent - safe to run on every start.
    # (preDeployCommand requires a paid Render plan; this is the free-tier equivalent)
    # DATABASE_URL must be set as an environment variable in the Render dashboard.
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && node index.js

    envVars:
      - key: NODE_ENV
        value: production
      # Set DATABASE_URL in the Render dashboard as a secret environment variable.
      # Format: mysql://user:password@host:port/database

    healthCheckPath: /common/v1/healthcheck
